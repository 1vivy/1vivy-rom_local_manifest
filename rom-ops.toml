# Draft manifest-side contract. REMOTES.md is generated; this file is authoritative.
schema = 1

[remotes]
title = "Remote ledger"
description = "This ledger records every configured remote by role; remote names are not authoritative."
columns = ["Repository", "Remote", "URL", "Role", "Required", "Purpose", "Base-Branch"]
separator_row = "|---|---|---|---|---|---| --- |"
fork_oid_length = 40
footer = '''

## Base branches

`Base-Branch` records the branch on the declared `root-upstream` remote from which the
contract was derived, the measured fork-point OID, and the cached distance from that fork
point to the fetched upstream branch. Restrict candidates to refs on that declared remote
and re-derive with `git merge-base`; the recorded distance is a cache, not authority.

Rows for repositories without a declared `root-upstream` carry
`n/a (no declared root-upstream)`. Every `root-upstream` row must instead carry a measured
branch, fork point and distance. Fetch every declared remote before making a base claim.
'''
[consumer]
# Base-manifest authority for provisioning an absent consumer root. The
# provisioning gate composes this base with the selected local manifest and
# refuses without it, because a consumer tree inited against an unnamed base is
# not reproducible.
#
# Every value here is DERIVED from the tree that already builds this program,
# never chosen: the URL is `remote.origin.url` of
# /srv/android/cleanroom-features-v4/.repo/manifests.git, the revision is that
# checkout's `[branch "default"] merge` pin (which is also the base pin the
# features-v6 manifest header declares), and the groups string is repo's own
# default because that checkout carries no `manifest.groups` - it was inited
# without `--groups`. The revision is an exact OID rather than `16.0` so the
# consumer root cannot drift with crDroid between provisioning runs.
base_manifest_url = "https://github.com/crdroidandroid/android.git"
base_manifest_revision = "a311bc97e4784ee24e8f97e377d06bdbff85b4bb"
groups = "default"

[publication]
allowed_write_orgs = ["1vivy"]

