# Source/blob pairs. `rom verify declaration-coherence` reads these to cross-check
# each source repository's proprietary-files*.txt declarations against the paired
# blob repository's actual tree, in BOTH directions: a declared path absent from the
# blob is MISSING, and a payload path under proprietary/ or radio/ that nothing
# declares is UNDECLARED. That is the mechanized form of the paired-changes rule -
# both halves land whole, or neither.
#
# Three pairs exist in this graph. macan, macanc and fairlady have none: their
# proprietary vendor trees are consumed from the camera-port organization rather
# than forked under 1vivy, so no 1vivy blob repository pairs with them.

